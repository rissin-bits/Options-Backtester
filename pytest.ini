[pytest]
testpaths = tests
# Deliberately NOT the default "test_*.py *_test.py": the default *_test.py
# pattern makes pytest import backend/stress_test.py as a test module, which
# is a production module, not a test.
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
